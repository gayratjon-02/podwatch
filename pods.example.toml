# Copy to pods.toml and edit. pods.toml is git-ignored so real addresses never get committed.
# Top level keys are defaults for every pod; a [[pod]] table can override any of them.

user = "root"
key = "~/.ssh/id_ed25519"
root = "/workspace"            # remote directory scanned for *.log files and the metrics file
train_log = "trainer_log.jsonl" # name of the per-step metrics file, one JSON object per line

[[pod]]
name = "pod1"
host = "203.0.113.10"
port = 22

[[pod]]
name = "pod2"
host = "203.0.113.11"
port = 40022
root = "/workspace/experiments"
